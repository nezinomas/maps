{% load static %}

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{trip.title}}{% endblock %}</title>
    <link href="{% static 'css/main.css' %}?v=1" rel="stylesheet" type="text/css" />
    <link href="{% static 'css/css-loader.css' %}" rel="stylesheet" type="text/css">

    <!-- Served from /static, pinned versions: no third-party CDN can change what runs here.
         Alpine was "//unpkg.com/alpinejs" (newest release, no https, no integrity) until 2026-11-22. -->
    <script src="{% static 'js/jquery-3.8.0.min.js' %}" type="text/javascript"></script>
    <script src="{% static 'js/htmx-2.0.11.min.js' %}" type="text/javascript"></script>
    <script src="{% static 'js/alpinejs-3.17.5.min.js' %}" defer></script>


    <link rel='stylesheet' id='google-font-playfair-display-css' href='https://fonts.googleapis.com/css?family=Playfair+Display:400,%20%20%20%20400italic,700,700italic,900,900italic' type='text/css' media='all' />
    <link rel='stylesheet' id='google-font-lora-css'  href='https://fonts.googleapis.com/css?family=Lora:400,400italic,700,700italic' type='text/css' media='all' />
    {% block head %}{% endblock %}
</head>

<body>
    {% block content %}{% endblock %}
</body>
</html>
