    <script>
		(function() {
			var request, b = document.body, c = 'className', cs = 'customize-support', rcs = new RegExp('(^|\\s+)(no-)?'+cs+'(\\s+|$)');

				request = true;

			b[c] = b[c].replace( rcs, ' ' );
			// The customizer requires postMessage and CORS (if the site is cross domain).
			b[c] += ( window.postMessage && request ? ' ' : ' no-' ) + cs;
		}());
    //# sourceURL=wp_customize_support_script
    </script>

    <script>
    // Modula normally initialises galleries on jQuery's document-ready event,
    // which has already fired by the time htmx injects these posts, so the
    // galleries are never laid out and their images stay hidden (opacity:0 in a
    // collapsed grid). We re-run Modula's initialiser ourselves. Two timing
    // hazards this has to survive:
    //   1. htmx runs THIS inline script immediately, before the external Modula
    //      script injected in the same swap has downloaded, so the plugin may
    //      not exist yet. The script tag's onload handler calls us the moment it
    //      is ready (reliable even on a cold first load); the poll is a fallback.
    //   2. On the first (cold) load the grid can be laid out before its
    //      container has its final width, leaving it collapsed. We trigger a
    //      resize once so Modula recomputes the layout.
    (function () {
        function initGalleries(tries) {
            if (!window.jQuery) { return; }
            var $ = window.jQuery;
            var pending = $('.modula.modula-gallery:not(.modula-initialized)');
            if (!pending.length) { return; }
            if (!$.fn.modulaGallery) {
                if ((tries || 0) < 200) {
                    window.setTimeout(function () { initGalleries((tries || 0) + 1); }, 100);
                }
                return;
            }
            $('body').addClass('modula-best-grid-gallery');
            pending.each(function () {
                var el = $(this);
                el.addClass('modula-initialized');
                el.modulaGallery(el.data('config'));
            });
            // Nudge Modula to recompute the grid once the container has real width.
            window.setTimeout(function () { $(window).trigger('resize'); }, 250);
        }

        window.__initModulaGalleries = initGalleries;

        if (!window.__modulaHtmxBound) {
            window.__modulaHtmxBound = true;
            document.addEventListener('htmx:afterSettle', function () { initGalleries(0); });
        }
        initGalleries(0);
    })();
    </script>
