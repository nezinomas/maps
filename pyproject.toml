[project]
name = "maps"
version = "0.1.0"
description = "traveling app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.4",
    "django-bulk-update-or-create>=0.3.0",
    "django-cotton>=2.6.2",
    "django-environ>=0.13.0",
    "django-htmx>=1.27.0",
    "django-redis>=6.0.0",
    "django-vanilla-views>=3.0.0",
    "fitdecode>=0.11.0",
    "garminconnect>=0.3.3",
    "numpy>=2.4.4",
    "oauthlib>=3.3.1",
    "orjson>=3.11.8",
    "parser>=0.0.2",
    "postgis>=1.0.4",
    "psycopg2-binary>=2.9.12",
    "python-dateutil>=2.9.0.post0",
    "python-wordpress-xmlrpc>=2.3",
    "requests>=2.33.1",
    "wordpress-api>=1.2.9",
]

[project.optional-dependencies]
dev = [
    "django-debug-toolbar>=5.2.0",
    "django-extensions>=4.1",
    "django-override-storage>=0.3.2",
    "django-test-without-migrations>=0.6",
    "django-webtest>=1.9.13",
    "mock>=5.2.0",
    "pyfakefs>=5.8.0",
    "pytest>=8.3.5",
    "pytest-clarity>=1.0.1",
    "pytest-cov>=6.1.1",
    "pytest-diff>=0.1.14",
    "pytest-django>=4.11.1",
    "pytest-factoryboy>=2.7.0",
    "pytest-forked>=1.6.0",
    "pytest-freezer>=0.4.9",
    "pytest-icdiff>=0.9",
    "pytest-mock>=3.14.0",
    "pytest-raises>=0.11",
    "pytest-randomly>=3.16.0",
    "pytest-sugar>=1.0.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.11.10",
    "selenium>=4.32.0",
    "webtest>=3.0.4",
]

[tool.ruff.lint]
select = [
    "E",
    "N",
    "R",
    "I",
]

[tool.uv.sources.parser]
path = "wheels/parser-0.0.2-cp313-cp313-win_amd64.whl"
